<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>${Title}</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; margin: 32px; color: #222; }
        h1 { color: #2c3e50; }
        table { border-collapse: collapse; width: 100%; max-width: 760px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #2c3e50; color: #fff; }
        tr:nth-child(even) { background: #f7f7f7; }
        nav a { margin-right: 14px; }
        .empty { color: #777; font-style: italic; }
    </style>
</head>
<body>
    <nav>
        <a href="/user/profile">Профиль</a>
        <a href="/user/list">Список пользователей</a>
    </nav>

    <h1>${Title}</h1>

    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Имя</th>
                <th>Email</th>
                <th>Возраст</th>
            </tr>
        </thead>
        <tbody>
$foreach(var user in Users)
            <tr>
                <td>${user.Id}</td>
                <td>${user.Name}</td>
                <td>${user.Email}</td>
                <td>${user.Age}</td>
            </tr>
$endfor
        </tbody>
    </table>
</body>
</html>
