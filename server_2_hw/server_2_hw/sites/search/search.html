<html>

<head>
    <title>Поиск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Afacad";
            font-weight: bold;
        }

        .search {
            display: flex;
            align-items: center;
            gap: 9.28px;
            background-color: #FAFAFA;
            border: 1.16px solid;
            border-color: #EEEEEE;
            border-radius: 18.55px;
            padding-left: 27.83px;
            padding-right: 27.83px;
            width: 621.45px;
            height: 65.1px;
        }

        .search-text {
            width: 100%;
            height: 100%;
            font-family: "Poppins";
            font-size: 20px;
            font-weight: 400;
            line-height: 140%;
            border: none;
            outline: none;
            background: transparent;
        }

        .search-text::placeholder {
            color: #9E9E9E;
        }

        .icons {
            display: flex;
            gap: 27.83px;
        }

        .icon {
            width: 65px;
            height: 65px;
            border-radius: 18.57px;
            border: 1.16px solid;
            background-color: #FAFAFA;
            border-color: #EEEEEE;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon img {
            width: 32.5px;
        }

        .weather {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 55.65px;
        }


    </style>
</head>

<body>
<div class="weather">
    <div style="font-size: 32px">36°</div>
    <div style="font-size: 20px; color: #6E6CDF;">Ahmedabad</div>
</div>

<div class="content">
    <div style="font-size: 74px; gap: 9.28px">09:11:01</div>
    <div style="font-size: 36px; color: #6E6CDF; gap: 55.65px">Good Morning, Saad.</div>

    <form action="https://yandex.ru/search/" method="get" class="search">
        <img src="resources/search-01.svg" alt="search">
        <input type="text" name="text" placeholder="Search" class="search-text" autocomplete="off">
    </form>

    <div class="icons">
        <a class="icon" href="https://www.youtube.com/" target="_blank"><img src="resources/Frame.svg" alt="icon"></a>
        <a class="icon" href="https://chatgpt.com/" target="_blank"><img src="resources/Frame (1).svg" alt="icon"></a>
        <a class="icon" href="https://www.geeksforgeeks.org/" target="_blank"><img src="resources/Frame (2).svg" alt="icon"></a>
        <a class="icon" href="https://chat.deepseek.com/" target="_blank"><img src="resources/Frame (3).svg" alt="icon"></a>
        <a class="icon" href="https://github.com/" target="_blank"><img src="resources/Frame (4).svg" alt="icon"></a>
        <a class="icon" href="https://www.linkedin-status.com/" target="_blank"><img src="resources/Frame (5).svg" alt="icon"></a>
        <a class="icon" href="https://ya.ru/?npr=1&utm_referrer=https%3A%2F%2Fyandex.ru%2F" target="_blank"><img src="resources/plus-sign.svg" alt="icon"></a>
    </div>
</div>

</body>
</html>
